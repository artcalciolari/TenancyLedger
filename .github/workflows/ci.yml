name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Nunca cancelar uma execução de main pela metade: ela pode estar no estágio de deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Check backend production dependencies
        working-directory: ${{ github.workspace }}
        run: npm audit --workspace backend --omit=dev --audit-level=high

      - name: Check backend formatting
        run: npm run format:check

      - name: Lint backend
        run: npm run lint:check

      - name: Type-check backend
        run: npm run typecheck

      - name: Test backend diff coverage gate
        run: npm run test:diff-coverage

      - name: Run backend unit tests
        run: npm run test:ci

      - name: Enforce backend diff coverage
        env:
          DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_COVERAGE_FALLBACK_BASE: HEAD^
        run: npm run coverage:diff

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/
            backend/test/coverage/
          if-no-files-found: warn
          retention-days: 14

  backend-integration-image:
    name: Backend integration and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-quality
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18.3-alpine3.22@sha256:af27ebd3413839ccfdcdf88e91ca76ad82117e52192067b76de9bb5be7ea6e04
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenancyledger_test
        options: >-
          --health-cmd "pg_isready -U postgres -d tenancyledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: tenancyledger_test
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: payment-proofs-test
      MINIO_USE_SSL: 'false'
      MINIO_AUTO_CREATE_BUCKET: 'true'
      STORAGE_SSE_ENABLED: 'false'
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: tenancy-ledger-ci
      JWT_AUDIENCE: tenancy-ledger-api-ci
      AUTH_BOOTSTRAP_EMAIL: admin@example.com
      AUTH_BOOTSTRAP_PASSWORD: Strong-ci-password-123!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Start MinIO
        run: |
          docker run --detach --name minio-ci \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            --health-cmd "curl --fail http://localhost:9000/minio/health/live" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 15 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e \
            server /data

          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' minio-ci)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          if docker ps -a --format '{{.Names}}' | grep -q '^minio-ci$'; then
            docker logs minio-ci
          fi
          exit 1

      - name: Create test object-storage bucket
        run: >-
          node -e "const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
          const client = new S3Client({ endpoint: 'http://localhost:9000', region: 'us-east-1',
          forcePathStyle: true, credentials: { accessKeyId: process.env.MINIO_ACCESS_KEY,
          secretAccessKey: process.env.MINIO_SECRET_KEY } });
          client.send(new CreateBucketCommand({ Bucket: process.env.MINIO_BUCKET_NAME }))
          .catch((error) => { console.error(error); process.exit(1); });"

      - name: Apply database migrations
        run: npm run migration:run

      - name: Run backend end-to-end tests
        run: npm run test:e2e:ci

      - name: Build backend
        run: npm run build

      - name: Build backend production image
        run: docker build --tag tenancy-ledger-api:ci .

      - name: Verify compiled migrations in the runtime image
        run: |
          docker run --rm --network host \
            --env NODE_ENV=test \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT --env DB_USERNAME --env DB_PASSWORD --env DB_DATABASE \
            tenancy-ledger-api:ci npm run migration:show:prod

      - name: Smoke-test the backend production image
        run: |
          docker run --detach --name tenancy-ledger-api-ci --network host \
            --env NODE_ENV=test --env PORT=3001 \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT --env DB_USERNAME --env DB_PASSWORD --env DB_DATABASE \
            --env JWT_SECRET --env JWT_EXPIRES_IN --env JWT_ISSUER --env JWT_AUDIENCE \
            --env AUTH_BOOTSTRAP_EMAIL --env AUTH_BOOTSTRAP_PASSWORD \
            --env MINIO_ENDPOINT=127.0.0.1 \
            --env MINIO_PORT --env MINIO_ACCESS_KEY --env MINIO_SECRET_KEY \
            --env MINIO_BUCKET_NAME --env MINIO_USE_SSL --env STORAGE_SSE_ENABLED \
            --env THROTTLE_TTL_MS=60000 --env THROTTLE_LIMIT=100 \
            --env INVOICE_CRON_ENABLED=false \
            tenancy-ledger-api:ci

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health/ready; then
              exit 0
            fi
            sleep 2
          done

          if docker ps -a --format '{{.Names}}' | grep -q '^tenancy-ledger-api-ci$'; then
            docker logs tenancy-ledger-api-ci
          fi
          exit 1

      - name: Verify the runtime OpenAPI snapshot
        env:
          OPENAPI_URL: http://127.0.0.1:3001/docs-json
        run: npm run openapi:check

      - name: Stop runtime smoke-test container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^tenancy-ledger-api-ci$'; then
            docker rm --force tenancy-ledger-api-ci
          fi

      - name: Show MinIO logs on failure
        if: failure()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^minio-ci$'; then
            docker logs minio-ci
          fi

  frontend-quality-build:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Check frontend production dependencies
        working-directory: ${{ github.workspace }}
        run: npm audit --workspace frontend --omit=dev --audit-level=high

      - name: Verify generated OpenAPI types
        run: npm run api:check

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint:check

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend unit and component tests
        run: npm run test:ci

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build frontend
        run: npm run build

      - name: Build frontend production image
        working-directory: ${{ github.workspace }}
        run: docker build --file frontend/Dockerfile --tag tenancy-ledger-frontend:ci .

      - name: Smoke-test frontend production image
        run: |
          docker run --detach --name tenancy-ledger-frontend-ci \
            --add-host app:127.0.0.1 --add-host minio:127.0.0.1 \
            --publish 8080:8080 tenancy-ledger-frontend:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs tenancy-ledger-frontend-ci
          exit 1

      - name: Stop frontend smoke-test container
        if: always()
        run: docker rm --force tenancy-ledger-frontend-ci || true

  frontend-e2e:
    name: Frontend E2E (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # As suítes mockadas interceptam **/api/** no próprio browser: não dependem da API.
    needs: frontend-quality-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project=chromium --project=mobile-chromium
          - engine: firefox
            projects: --project=firefox
          - engine: webkit
            projects: --project=webkit --project=mobile-webkit --project=ipad
    defaults:
      run:
        working-directory: frontend

    env:
      E2E_SERVE_BUILD: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ steps.playwright.outputs.version }}

      - name: Install the Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Install the Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.engine }}

      - name: Build the frontend bundle for the E2E server
        # `tsc -b` já rodou em "Frontend quality and build"; aqui só o bundle importa.
        run: npx vite build

      - name: Run frontend end-to-end tests
        run: npx playwright test ${{ matrix.projects }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.engine }}
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  frontend-e2e-fullstack:
    name: Frontend E2E full-stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend-integration-image
      - frontend-quality-build
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:18.3-alpine3.22@sha256:af27ebd3413839ccfdcdf88e91ca76ad82117e52192067b76de9bb5be7ea6e04
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenancyledger_e2e
        options: >-
          --health-cmd "pg_isready -U postgres -d tenancyledger_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # O seed full-stack exige E2E_INTEGRATION=1 e um banco dedicado tenancyledger_*_e2e.
      E2E_INTEGRATION: '1'
      E2E_SERVE_BUILD: '1'
      E2E_TEST_PASSWORD: Fullstack-E2E-Password-123!
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: tenancyledger_e2e
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: payment-proofs-test
      MINIO_USE_SSL: 'false'
      STORAGE_SSE_ENABLED: 'false'
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: tenancy-ledger-ci
      JWT_AUDIENCE: tenancy-ledger-api-ci
      AUTH_BOOTSTRAP_EMAIL: admin@example.com
      AUTH_BOOTSTRAP_PASSWORD: Strong-ci-password-123!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Build backend production image
        working-directory: backend
        run: docker build --tag tenancy-ledger-api:ci .

      - name: Start MinIO
        working-directory: backend
        run: |
          docker run --detach --name minio-ci \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            --health-cmd "curl --fail http://localhost:9000/minio/health/live" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 15 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e \
            server /data

          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' minio-ci)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          docker logs minio-ci
          exit 1

      - name: Create test object-storage bucket
        working-directory: backend
        run: >-
          node -e "const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
          const client = new S3Client({ endpoint: 'http://localhost:9000', region: 'us-east-1',
          forcePathStyle: true, credentials: { accessKeyId: process.env.MINIO_ACCESS_KEY,
          secretAccessKey: process.env.MINIO_SECRET_KEY } });
          client.send(new CreateBucketCommand({ Bucket: process.env.MINIO_BUCKET_NAME }))
          .catch((error) => { console.error(error); process.exit(1); });"

      - name: Apply database migrations
        working-directory: backend
        run: npm run migration:run

      - name: Seed the full-stack fixtures
        working-directory: backend
        run: npm run test:e2e:seed

      - name: Start backend for frontend E2E
        working-directory: backend
        run: |
          docker run --detach --name tenancy-ledger-api-e2e --network host \
            --env NODE_ENV=test --env PORT=3000 \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT --env DB_USERNAME --env DB_PASSWORD --env DB_DATABASE \
            --env JWT_SECRET --env JWT_EXPIRES_IN --env JWT_ISSUER --env JWT_AUDIENCE \
            --env AUTH_BOOTSTRAP_EMAIL --env AUTH_BOOTSTRAP_PASSWORD \
            --env MINIO_ENDPOINT=127.0.0.1 \
            --env MINIO_PORT --env MINIO_ACCESS_KEY --env MINIO_SECRET_KEY \
            --env MINIO_BUCKET_NAME --env MINIO_USE_SSL --env STORAGE_SSE_ENABLED \
            --env THROTTLE_TTL_MS=60000 --env THROTTLE_LIMIT=100 \
            --env INVOICE_CRON_ENABLED=false \
            tenancy-ledger-api:ci

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/health/ready; then
              exit 0
            fi
            sleep 2
          done

          docker logs tenancy-ledger-api-e2e
          exit 1

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}

      - name: Install the Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build the frontend bundle for the E2E server
        run: npx vite build

      - name: Run full-stack end-to-end tests
        run: npm run e2e:integration

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fullstack
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Show backend logs on failure
        if: failure()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^tenancy-ledger-api-e2e$'; then
            docker logs tenancy-ledger-api-e2e
          fi

      - name: Show MinIO logs on failure
        if: failure()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^minio-ci$'; then
            docker logs minio-ci
          fi

      - name: Stop backend for frontend E2E
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^tenancy-ledger-api-e2e$'; then
            docker rm --force tenancy-ledger-api-e2e
          fi

      - name: Stop MinIO
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^minio-ci$'; then
            docker rm --force minio-ci
          fi

  deploy:
    name: Deploy to the pipeline server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-quality
      - backend-integration-image
      - frontend-quality-build
      - frontend-e2e
      - frontend-e2e-fullstack
    runs-on: self-hosted
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: backend

    env:
      # Única porta publicada no host. FRONTEND_BIND=127.0.0.1 restringe ao próprio servidor.
      FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '8080' }}
      FRONTEND_BIND: ${{ vars.FRONTEND_BIND || '0.0.0.0' }}
      # Origem pública usada pelo CORS e pelas URLs pré-assinadas de comprovantes.
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.deploy.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compose the deployment environment file
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_BOOTSTRAP_EMAIL: ${{ secrets.AUTH_BOOTSTRAP_EMAIL }}
          AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -euo pipefail
          for required in DB_USERNAME DB_PASSWORD DB_DATABASE JWT_SECRET \
            AUTH_BOOTSTRAP_EMAIL AUTH_BOOTSTRAP_PASSWORD MINIO_ACCESS_KEY MINIO_SECRET_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "Missing repository secret: $required"
              exit 1
            fi
          done

          origin="${PUBLIC_ORIGIN:-http://localhost:${FRONTEND_PORT}}"

          umask 077
          {
            echo "FRONTEND_BIND=${FRONTEND_BIND}"
            echo "FRONTEND_PORT=${FRONTEND_PORT}"
            echo "CORS_ORIGINS=${origin}"
            echo "SWAGGER_ENABLED=false"
            echo "LOG_LEVEL=info"
            echo "DB_USERNAME=${DB_USERNAME}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "DB_DATABASE=${DB_DATABASE}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "AUTH_BOOTSTRAP_EMAIL=${AUTH_BOOTSTRAP_EMAIL}"
            echo "AUTH_BOOTSTRAP_PASSWORD=${AUTH_BOOTSTRAP_PASSWORD}"
            echo "MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}"
            echo "MINIO_SECRET_KEY=${MINIO_SECRET_KEY}"
            # O nginx do frontend expõe o bucket em /payment-proofs/; o nome precisa casar.
            echo "MINIO_BUCKET_NAME=payment-proofs"
            echo "MINIO_PUBLIC_ENDPOINT=${origin}"
            echo "METRICS_TOKEN=${METRICS_TOKEN:-}"
          } > .env

      - name: Deploy the stack
        # Sem `--wait`: o serviço `migrate` é one-shot e termina, o que faria a espera falhar.
        # A prontidão é verificada pelo smoke test de /healthz abaixo.
        run: |
          set -euo pipefail
          docker compose --env-file .env ${COMPOSE_FILES} up \
            --build --detach --remove-orphans

      - name: Verify that only the frontend port is published
        run: |
          set -euo pipefail
          failed=0
          for service in app db minio; do
            container="$(docker compose --env-file .env ${COMPOSE_FILES} ps --quiet "$service")"
            if [ -n "$container" ] && [ -n "$(docker port "$container")" ]; then
              echo "Service '$service' unexpectedly publishes host ports:"
              docker port "$container"
              failed=1
            fi
          done
          frontend="$(docker compose --env-file .env ${COMPOSE_FILES} ps --quiet frontend)"
          echo "Frontend published ports:"
          docker port "$frontend"
          exit "$failed"

      - name: Smoke-test the deployed frontend
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:${FRONTEND_PORT}/healthz"; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env ${COMPOSE_FILES} logs --tail 200
          exit 1

      - name: Remove the deployment environment file
        if: always()
        run: rm -f .env

      - name: Prune dangling images
        if: always()
        run: docker image prune --force
